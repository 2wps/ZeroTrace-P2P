org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false

# Network resilience and socket timeout settings
systemProp.http.keepAlive=true
systemProp.http.proxyTimeout=120000
systemProp.https.proxyTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.connectionTimeout=120000
